[package]
name = "animation_component"
version = "0.1.0"
edition = "2024"
description = "Animation (pulsar.animation): the animator component (graphs, Montages, notifies, root motion, the physics blend), its animation phase and the skeletal pose physics rigs read and drive."

# Hosts (the editor through the plugin crate, the game) link it; everything
# registers through `inventory` once the crate is linked.
[lib]
name = "animation_component"

[features]
# `#[derive(SceneStore)]`'s generated GPU-column methods are wrapped in
# `#[cfg(feature = "gpu")]`, spliced into the crate defining the component.
default = ["gpu"]
gpu = []

[dependencies]
# The plugin's descriptor and its registrations' origin.
pulsar_plugins = { workspace = true }
# The tick phase, component events (the game's slim feature set, as the
# meshes' component).
engine_backend = { path = "../../../../crates/core/engine_backend", default-features = false, features = ["render"] }
# The skinned mesh it drives and the pose physics reads (`skinning`).
helio_component = { workspace = true }
inventory = { workspace = true }
# The animation runtime and skeletal formats.
skeletal_assets = { workspace = true }
engine_class_derive = { workspace = true }
# Enum properties get a dropdown editor: the derive names GPUI (as the meshes'
# component).
pulsar_reflection = { workspace = true, features = ["prims-gpui"] }
gpui-ce = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
pulsar_world_registry = { workspace = true }
pulsar_events = { workspace = true }
pulsar_scene_model = { workspace = true }
# The level record migration (`pulsar_class::records`).
pulsar_class = { workspace = true }
engine_fs = { workspace = true }
engine_state = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tracing = { workspace = true }
glam = { workspace = true, features = ["serde"] }

[dev-dependencies]
pulsar_game = { path = "../../../../crates/core/pulsar_game" }
tempfile = { workspace = true }

[lints]
workspace = true
