[package]
name = "skeletal_animation_plugin"
version = "0.1.0"
edition = "2021"
publish = false
description = "Animation (`pulsar.animation`): the plugin's root crate, the one place it registers everything it contributes (runtime registrations always, the editor's with `editor`)"
autoexamples = false

[features]
# The editor's registration (the animation editors' provider) and the crates
# it needs. A game links the root without it, so it takes no editor
# dependency.
editor = ["dep:skeletal_animation_editor", "dep:plugin_manager"]

[dependencies]
# The plugin gate and the registrations' collection.
pulsar_plugins = { workspace = true }
inventory = { workspace = true }
# The plugin's crates.
animation_component = { workspace = true }
skeletal_animation_editor = { workspace = true, optional = true }
# The engine seams the plugin registers into (the game's slim feature set).
engine_backend = { path = "../../../crates/core/engine_backend", default-features = false, features = ["render"] }
helio_component = { workspace = true }
pulsar_class = { workspace = true }
pulsar_events = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_world_registry = { workspace = true }
# The editor's extension points.
plugin_manager = { workspace = true, optional = true }

[dev-dependencies]
# The plugin's integration tests (`tests/`): the plugin as a game links it.
pulsar_game = { path = "../../../crates/core/pulsar_game" }
skeletal_assets = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
