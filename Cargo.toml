[package]
name = "skeletal_animation_plugin"
version = "0.1.0"
edition = "2021"
description = "Skeletal animation editor for the Pulsar editor"

[lib]
crate-type = ["cdylib", "rlib"]
name = "skeletal_animation_plugin"

[features]
# Pulsar statically links this crate when it is used as a built-in editor.
# Dynamic plugin builds keep the loader ABI exports by default.
builtin = []

[dependencies]
gpui-ce = { workspace = true }
ui      = { workspace = true }

plugin_editor_api = { workspace = true }
ui_common         = { workspace = true }

uuid       = { workspace = true }
smol       = { workspace = true }
log        = { workspace = true }
tracing    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
anyhow     = { workspace = true }
wgpu       = { workspace = true }
bytemuck   = { workspace = true }

[dev-dependencies]
# Validates the WGSL sources offline with the same front end wgpu uses.
naga = { version = "30", features = ["wgsl-in"] }
