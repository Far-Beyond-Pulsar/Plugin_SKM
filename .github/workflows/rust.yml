name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    # This crate is a member of the Pulsar-Native workspace (its dependencies
    # are `workspace = true`), so it builds inside a Pulsar-Native checkout,
    # at the path Pulsar-Native vendors it under.
    - uses: actions/checkout@v4
      with:
        repository: Far-Beyond-Pulsar/Pulsar-Native
        submodules: recursive
        path: pulsar
    - uses: actions/checkout@v4
      with:
        path: pulsar/plugins/vendor/skm_editor
    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          pkg-config libssl-dev libfontconfig1-dev libfreetype6-dev \
          libx11-dev libx11-xcb-dev libwayland-dev libxkbcommon-x11-dev \
          libasound2-dev libudev-dev mesa-vulkan-drivers
    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: pulsar
    - name: Build
      working-directory: pulsar
      run: cargo build -p skeletal_animation_plugin --features skeletal_animation_plugin/editor --verbose
    - name: Run tests
      working-directory: pulsar
      run: cargo test -p skeletal_animation_plugin -p animation_component -p skeletal_animation_editor -p skeletal_assets --verbose -- --test-threads=1
    - name: GPU skinning parity and resource lifecycle (software Vulkan)
      working-directory: pulsar
      env:
        WGPU_BACKEND: vulkan
        XDG_RUNTIME_DIR: /tmp
      run: cargo test -p skeletal_animation_editor --lib -- --ignored --skip skinning_geometry_benchmark --skip skinning_render_benchmark --nocapture --test-threads=1
